      <div class="app-title">Filtro de candidatos</div>
      <div class="app-subtitle">Team Tailor</div>
    </div>
  </div>

  <main>
    <section class="card">
      <h2>1. Proceso y etapa</h2>
      <div class="row">
        <div class="field">
          <label for="job-select">Proceso (vacante)</label>
          <select id="job-select">
            <option value="">Cargando procesos…</option>
          </select>
        </div>
        <div class="field">
          <label for="stage-select">Etapa</label>
          <select id="stage-select" disabled>
            <option value="">Selecciona un proceso primero</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>2. Perfil de cargo</h2>
      <div class="row">
        <div class="field">
          <label for="perfil-file">Subir perfil de cargo (.docx o .pdf)</label>
          <input type="file" id="perfil-file" accept=".docx,.pdf" />
          <button id="btn-upload-perfil" class="btn secondary">Cargar perfil</button>
        </div>
      </div>

      <div id="requirements-editor" class="requirements-editor hidden">
        <h2>Requisitos detectados (edítalos si hace falta)</h2>

        <div class="field">
          <label for="req-formacion">Formación excluyente (separada por comas)</label>
          <input type="text" id="req-formacion" placeholder="ej: ingeniería comercial, psicología, contador auditor" />
        </div>

        <div class="field">
          <label for="req-area">Palabras clave de área / competencias</label>
          <input type="text" id="req-area" placeholder="ej: ventas, marketing, finanzas, RRHH, sindicato" />
        </div>

        <div class="field">
          <label for="req-industria">Palabras clave de industria</label>
          <input type="text" id="req-industria" placeholder="ej: industrial, alimentos, forestal" />
        </div>

        <div class="row">
          <div class="field">
            <label for="req-salario-min">Renta mínima sugerida</label>
            <input type="number" id="req-salario-min" placeholder="3500000" />
          </div>
          <div class="field">
            <label for="req-salario-max">Renta máxima sugerida</label>
            <input type="number" id="req-salario-max" placeholder="4000000" />
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>3. Filtrar</h2>
      <label class="checkbox-row">
        <input type="checkbox" id="write-back" />
        Escribir nota con el resultado en cada candidato dentro de Team Tailor
      </label>
      <button id="btn-filtrar" class="btn primary" disabled>Filtrar candidatos</button>
      <p id="status-msg" class="status-msg"></p>
    </section>

    <section class="card">
      <h2>Resultados</h2>
      <div id="results-summary" class="results-summary"></div>
      <div class="table-wrap">
        <table id="results-table" class="results-table hidden">
          <thead>
            <tr>
              <th>Match</th>
              <th>Candidato</th>
              <th>Puntaje</th>
              <th>Formación</th>
              <th>Señales de área</th>
              <th>Señales industria</th>
              <th>Años</th>
              <th>Renta esperada</th>
              <th>Nota</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
